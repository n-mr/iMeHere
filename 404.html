<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#030305">
    <title>404 — v2Talal</title>
    <meta name="description" content="404 — Page Not Found">
    <link rel="icon" type="image/svg+xml" href="/img/favicon/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/img/favicon/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'GlitchFont';
            src: url('/fonts/Glitch_Font.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background: #030305;
            font-family: 'Cairo', sans-serif;
            color: #ffffff;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mesh-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 25% 30%, rgba(0, 229, 255, 0.13) 0%, transparent 55%),
                radial-gradient(circle at 78% 22%, rgba(160, 32, 240, 0.12) 0%, transparent 55%),
                radial-gradient(circle at 55% 85%, rgba(255, 0, 119, 0.10) 0%, transparent 55%);
            background-size: 160% 160%;
            background-repeat: no-repeat;
            background-position: 0% 0%;
            animation: auroraA 36s ease-in-out infinite;
        }
        .mesh-bg::before {
            content: '';
            position: absolute;
            inset: -10%;
            background:
                radial-gradient(circle at 80% 65%, rgba(0, 229, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 20% 75%, rgba(160, 32, 240, 0.10) 0%, transparent 50%);
            background-size: 170% 170%;
            background-repeat: no-repeat;
            background-position: 100% 0%;
            animation: auroraB 44s ease-in-out infinite;
        }
        .mesh-bg::after {
            content: '';
            position: absolute;
            inset: -10%;
            background:
                radial-gradient(circle at 70% 20%, rgba(255, 0, 119, 0.07) 0%, transparent 52%),
                radial-gradient(circle at 30% 90%, rgba(0, 229, 255, 0.06) 0%, transparent 52%);
            background-size: 180% 180%;
            background-repeat: no-repeat;
            background-position: 50% 50%;
            animation: auroraC 52s ease-in-out infinite;
        }
        .noise-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            opacity: 0.025;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        .card {
            position: relative;
            z-index: 2;
            width: min(94vw, 720px);
            min-height: min(68vh, 540px);
            padding: clamp(28px, 7vmin, 64px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(16px, 3vmin, 26px);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            background: rgba(18, 18, 24, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4vmin;
            box-shadow:
                0 8px 32px 0 rgba(0, 0, 0, 0.6),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
            text-align: center;
            animation: rise 300ms ease-out backwards;
        }
        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(5.5rem, 26vmin, 11rem);
            font-weight: 900;
            letter-spacing: 6px;
            line-height: 1;
            background: linear-gradient(135deg, #00e5ff 0%, #a020f0 55%, #ff0077 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 48px rgba(0, 229, 255, 0.45);
            filter: drop-shadow(0 0 24px rgba(160, 32, 240, 0.25));
        }
        .typewriter {
            font-family: 'GlitchFont', 'JetBrains Mono', monospace;
            font-size: clamp(1rem, 3vmin, 1.4rem);
            color: #00e5ff;
            direction: ltr;
            text-align: center;
            min-height: 3.6em;
        }
        .typed-lines {
            text-align: center;
            min-width: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .typed-lines div {
            line-height: 1.5;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.35);
        }
        .btn-home {
            display: inline-block;
            padding: 15px 44px;
            border-radius: 999px;
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
            background: linear-gradient(135deg, #00e5ff 0%, #a020f0 60%, #ff0077 100%);
            box-shadow: 0 6px 20px rgba(160, 32, 240, 0.35);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .btn-home.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .btn-home:hover {
            box-shadow: 0 10px 32px rgba(255, 0, 119, 0.45);
            transform: translateY(-2px);
        }
        .btn-home:focus-visible {
            outline: 2px solid #00e5ff;
            outline-offset: 3px;
        }
        @keyframes auroraA {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
        }
        @keyframes auroraB {
            0%, 100% { background-position: 100% 0%; }
            50% { background-position: 0% 100%; }
        }
        @keyframes auroraC {
            0%, 100% { background-position: 50% 50%; }
            50% { background-position: 82% 18%; }
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0s !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>
    <div class="noise-overlay"></div>
    <main class="card">
        <div class="error-code">404</div>
        <div class="typewriter" id="typed" aria-live="polite">
            <div class="typed-lines"></div>
        </div>
        <a href="/" class="btn-home" id="homeBtn">Back to Home</a>
    </main>
    <script>
        (function () {
            var lines = [
                { t: "That's Error Page.", ar: false },
                { t: "The Requested URL Was Not Found On Talal Website.", ar: false },
                { t: "Go Back And Don't Come Again Here Ok.. :)", ar: false }
            ];
            var el = document.querySelector('#typed .typed-lines');
            var btn = document.getElementById('homeBtn');
            var lineIndex = 0;
            var charIndex = 0;
            var speed = 42;
            var delay = 900;
            var i, span;
            var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            if (reduced) {
                el.textContent = '';
                for (i = 0; i < lines.length; i++) {
                    span = document.createElement('div');
                    span.textContent = lines[i].t;
                    el.appendChild(span);
                }
                btn.classList.add('visible');
                return;
            }

            function type() {
                if (lineIndex >= lines.length) {
                    btn.classList.add('visible');
                    return;
                }
                var line = lines[lineIndex];
                if (charIndex === 0) {
                    span = document.createElement('div');
                    span.textContent = '';
                    span.appendChild(document.createTextNode(''));
                    el.appendChild(span);
                }
                span.textContent = line.t.slice(0, charIndex + 1);
                charIndex++;
                if (charIndex < line.t.length) {
                    setTimeout(type, speed);
                } else {
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(type, delay);
                }
            }
            type();
        })();
    </script>
</body>
</html>
